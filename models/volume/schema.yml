version: 2

sources:
  - name: snowflake_information_schema
    description: Snowflake system information schema tables
    database: "{{ target.database }}"
    schema: information_schema
    tables:
      - name: tables
        description: Metadata about all tables in the database
        columns:
          - name: table_catalog
            description: Database name
          - name: table_schema
            description: Schema name
          - name: table_name
            description: Table name
          - name: row_count
            description: Approximate row count
          - name: bytes
            description: Size in bytes
          - name: created
            description: Table creation timestamp
          - name: last_altered
            description: Last modification timestamp

models:
  - name: volume_metrics_history
    description: |
      Incremental snapshot of volume metrics for enrolled tables.
      This model captures row counts to detect volume anomalies.

      **Key Features:**
      - Dual-source architecture: table queries + information_schema
      - Instant backfilling: custom timestamp columns provide 30 days of historical data
      - Rolling window statistics: 28-day baseline for anomaly detection
      - Idempotent - can be re-run without duplicating data
      - **Supports --full-refresh**: Can be rebuilt during development/tuning without affecting snapshot history

      **Use Cases:**
      - Feed volume anomaly detection algorithm
      - Monitor table growth patterns
      - Detect sudden spikes or drops in data volume
      - Track data pipeline health

    config:
      materialized: incremental
      unique_key: metric_id

    columns:
      - name: metric_id
        description: Unique identifier for this metric snapshot (surrogate key)
        tests:
          - not_null
          - unique

      - name: database_name
        description: Database/catalog name
        tests:
          - not_null

      - name: schema_name
        description: Schema name
        tests:
          - not_null

      - name: table_name
        description: Table name
        tests:
          - not_null

      - name: full_table_name
        description: Fully qualified table name (database.schema.table)
        tests:
          - not_null

      - name: row_count
        description: Number of rows in the table at snapshot time
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: snapshot_timestamp
        description: Exact timestamp when snapshot was taken
        tests:
          - not_null

      - name: source_type
        description: |
          Source of the metric data:
          - 'table': Direct table query using custom timestamp column
          - 'metadata': Information schema row_count metadata
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['table', 'metadata']

      - name: timestamp_column
        description: |
          Name of the timestamp column used for direct table queries.
          NULL for metadata-sourced metrics.

      - name: _loaded_at
        description: ETL load timestamp
        tests:
          - not_null

      - name: expected_row_count_mean
        description: |
          Rolling average row count over the last 28 days.
          Calculated using time-based window (works at any run frequency).
          NULL when observation_count < 7.

      - name: expected_row_count_stddev
        description: |
          Rolling standard deviation of row count over the last 28 days.
          Used to calculate anomaly thresholds.
          NULL when observation_count < 7.

      - name: observation_count
        description: |
          Number of historical observations used in rolling window calculation.
          Minimum of 7 required for anomaly detection.

      - name: expected_row_count_min
        description: |
          Minimum expected row count threshold calculated as:
          expected_row_count_mean - (row_count_sigma_multiplier × expected_row_count_stddev)

          Uses absolute row count sigma: very_low=16σ, low=8σ, medium=4σ, high=2σ, very_high=1σ.

      - name: expected_row_count_max
        description: |
          Maximum expected row count threshold calculated as:
          expected_row_count_mean + (row_count_sigma_multiplier × expected_row_count_stddev)

          Uses absolute row count sigma: very_low=16σ, low=8σ, medium=4σ, high=2σ, very_high=1σ.

      - name: is_spike_high
        description: |
          Change-based anomaly flag: Row count change exceeded upper threshold AND passed materiality filter.
          Materiality requires: >1,000 rows deviation AND >200% relative change.

      - name: is_drop_low
        description: |
          Change-based anomaly flag: Row count change fell below lower threshold AND passed materiality filter.
          Materiality requires: >1,000 rows deviation AND >200% relative change.

      - name: is_row_count_anomaly
        description: |
          Size-based anomaly flag: Absolute row count out of expected range AND passed materiality filter.
          Materiality requires: >100 rows deviation AND >5% relative change.

      - name: is_anomaly
        description: |
          **MASTER ANOMALY FLAG**

          TRUE if ANY of the detection flags (is_spike_high, is_drop_low, is_row_count_anomaly) is TRUE.

          Detection combines:
          1. Statistical significance (sigma-based thresholds)
          2. Materiality filters (absolute + relative thresholds)

          Tests read this column to determine pass/fail.

      - name: row_count_change_anomaly_reason
        description: |
          Human-readable reason for change-based anomalies:
          - 'Row Count Change - Spike': Growth rate significantly exceeded expected
          - 'Row Count Change - Dip': Growth rate significantly below expected
          - NULL: No change-based anomaly detected

      - name: row_count_anomaly_reason
        description: |
          Human-readable reason for size-based anomalies:
          - 'Row Count - Spike': Absolute row count significantly above expected
          - 'Row Count - Dip': Absolute row count significantly below expected
          - NULL: No size-based anomaly detected

      - name: anomaly_reason
        description: |
          Combined anomaly reason (comma-separated if multiple types detected).
          Examples:
          - 'Row Count Change - Spike'
          - 'Row Count - Dip'
          - 'Row Count Change - Spike, Row Count - Spike'

  - name: volume_metrics_history_prep
    description: |
      Dual-source per-snapshot volume history, one row per (object, snapshot). Unions
      custom-timestamp row-count series (stg_volumn_metric_custom_table, source_type
      'table') with INFORMATION_SCHEMA row counts from snap_monitored_table_metadata
      (source_type 'metadata'), stamps surrogate keys, and derives row_count_change as
      the lag difference vs the object's previous snapshot. Feeds
      volume_metrics_history_final, which builds the baseline and scores anomalies.
    config:
      materialized: table
    columns:
      - name: metric_id
        description: Primary key. Surrogate key of (full_table_name, snapshot_timestamp, source_type, timestamp_column).
        tests:
          - not_null
          - unique

      - name: object_id
        description: |
          Surrogate key of (full_table_name, source_type, timestamp_column). Identifies
          the monitored series; the downstream baseline pool is partitioned on this.
        tests:
          - not_null

      - name: _loaded_at
        description: ETL load timestamp (current_timestamp() stamped in the final CTE).

      - name: database_name
        description: Database/catalog name (uppercased).

      - name: schema_name
        description: Schema name (uppercased).

      - name: table_name
        description: Table name (uppercased).

      - name: full_table_name
        description: Fully qualified table name (database.schema.table), uppercased.

      - name: row_count
        description: |
          Row count at snapshot time. Cumulative for custom-timestamp ('table') sources;
          INFORMATION_SCHEMA row_count for 'metadata' sources.

      - name: snapshot_timestamp
        description: Hourly snapshot timestamp.

      - name: source_type
        description: |
          Source of the metric:
          - 'table': custom timestamp-column backfill (stg_volumn_metric_custom_table)
          - 'metadata': information_schema row_count snapshot

      - name: timestamp_column
        description: Timestamp column used for 'table' sources; NULL for 'metadata'.

      - name: sensitivity
        description: Configured sensitivity level (very_low, low, medium, high, very_high).

      - name: row_count_change_mad_multiplier
        description: Number of MADs used downstream to set the row_count_change band (from the sensitivity map).

      - name: row_count_change
        description: |
          Change in row_count vs the object's previous snapshot (lag difference; may be
          negative if rows were deleted). NULL for an object's first snapshot, and 0 is
          converted to NULL so flat snapshots are excluded from the downstream MED/MAD.

  - name: volume_metrics_history_final
    description: |
      Robust (median/MAD) volume anomaly scoring, one row per object per snapshot.

      For each snapshot row a baseline is built from that object's PRIOR snapshots only
      (a row is never part of its own baseline). Rather than all history, the baseline
      pool is the med_sample_size prior snapshots whose row_count_change is NEAREST to
      the current row's change. row_count_change is scored against a
      MED +/- row_count_change_mad_multiplier * MAD band, where MED is the median of
      that nearest prior pool and MAD = median(|value - MED|) (floored so a burst-loading
      table never collapses the band to zero width). MAD is used directly as the spread
      unit, so the multiplier is a number of MADs (not sigmas).

      A row is flagged when row_count_change falls outside
      [row_count_change_lower_limit, row_count_change_upper_limit].

      Note: this is anomaly-detection infrastructure, so it is intentionally NOT enrolled
      in the volume_anomaly / freshness_anomaly tests (that would be self-referential),
      consistent with volume_metrics_history above.

    config:
      materialized: table

    columns:
      - name: metric_id
        description: Primary key. Surrogate key of (full_table_name, snapshot_timestamp, source_type, timestamp_column).
        tests:
          - not_null
          - unique

      - name: object_id
        description: |
          Surrogate key of (full_table_name, source_type, timestamp_column). Identifies
          the monitored series; the prior-rows baseline pool is partitioned on this.
        tests:
          - not_null

      - name: _loaded_at
        description: ETL load timestamp (stamped once in the prep final CTE).
        tests:
          - not_null

      - name: database_name
        description: Database/catalog name.
        tests:
          - not_null

      - name: schema_name
        description: Schema name.
        tests:
          - not_null

      - name: table_name
        description: Table name.
        tests:
          - not_null

      - name: full_table_name
        description: Fully qualified table name (database.schema.table).
        tests:
          - not_null

      - name: row_count
        description: Row count of the monitored table at snapshot time.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: row_count_change
        description: |
          Change in row_count vs the object's previous snapshot (lag difference; may be
          negative if rows were deleted). NULL for an object's first snapshot.

      - name: snapshot_timestamp
        description: Hourly snapshot timestamp.
        tests:
          - not_null

      - name: source_type
        description: |
          Source of the metric:
          - 'table': custom timestamp-column backfill (staging)
          - 'metadata': information_schema row_count snapshot
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['table', 'metadata']

      - name: timestamp_column
        description: Timestamp column used for 'table' sources; NULL for 'metadata'.

      - name: sensitivity
        description: Configured sensitivity level for the object.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['very_low', 'low', 'medium', 'high', 'very_high']

      - name: row_count_change_mad_multiplier
        description: Number of MADs used to set the row_count_change band (from the sensitivity map).
        tests:
          - not_null

      - name: prior_obs_count
        description: |
          Number of prior snapshots in this row's baseline pool. NULL for an object's
          first snapshot (no prior rows, hence no baseline).

      - name: row_count_change_med
        description: Median row_count_change of the prior-rows pool. NULL when there is no baseline.

      - name: row_count_change_mad
        description: Median absolute deviation of prior-pool row_count_change. NULL when there is no baseline.

      - name: row_count_change_lower_limit
        description: "Lower band: row_count_change_med - row_count_change_mad_multiplier * row_count_change_mad."

      - name: row_count_change_upper_limit
        description: "Upper band: row_count_change_med + row_count_change_mad_multiplier * row_count_change_mad."

      - name: row_count_change_modified_z_score
        description: |
          Distance of row_count_change from the baseline median in MAD units:
          abs(row_count_change - row_count_change_med) / row_count_change_mad. A
          diagnostic of how far outside the band a value sits. NULL when there is
          no baseline or row_count_change is NULL.

      - name: is_row_count_change_anomaly
        description: |
          TRUE when row_count_change falls outside
          [row_count_change_lower_limit, row_count_change_upper_limit].
          FALSE when there is no baseline, row_count_change is NULL, or within the band.
        tests:
          - not_null

      - name: row_count_change_similar_z_score_count
        description: |
          Count of PRIOR snapshots of the same object whose
          row_count_change_modified_z_score is within +/-20% of this row's z-score
          (i.e. in [z * 0.8, z * 1.2]). Prior-only, so a row never counts itself.
          A high count means a deviation of this magnitude is routine for the
          object; a count near 0 means it is novel. 0 when the row has a z-score
          but no qualifying prior snapshots; NULL only when the row has no
          baseline (no z-score).
